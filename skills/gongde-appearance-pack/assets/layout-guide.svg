    <path d="M160 148V306" stroke="#97aa91" stroke-dasharray="2 4"/>
    <path d="M48 302H272" stroke="#90643d" stroke-width="1.5"/>
    <text x="160" y="85" text-anchor="middle" font-size="14">功德总数 · 客户端绘制</text>
    <text x="160" y="126" text-anchor="middle" font-size="12">+1 瞬时反馈</text>
    <text x="160" y="222" text-anchor="middle" font-size="16">形象与完整动作</text>
    <text x="160" y="246" text-anchor="middle" font-size="12">虚线：新作动作安全区</text>
    <text x="40" y="333" font-size="11">(0,0) 左下原点　　中心 x=120</text>
    <path d="M280 80H310M280 121H310M272 148H310M272 302H310" stroke="#73806d"/>
